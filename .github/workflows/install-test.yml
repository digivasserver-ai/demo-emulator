name: "Demo: microG install-test"

# Phase 2a: install the patched GmsCore (built by ci-repro) as a privileged
# app on the ATD emulator, configure DroidGuard remote mode, and verify the
# multi-step reference server responds. No video yet — prove the wiring first.
#
# Writability strategy (no `adb reboot`, which hangs on ATD images):
#   - boot with -writable-system: writes to /system persist in the AVD qcow2
#   - adb remount arms overlayfs; it applies at the NEXT kernel boot, which
#     we trigger by relaunching the emulator process (not guest reboot)
#   - after installing priv-app + CA cert, `adb shell stop && start` restarts
#     the framework (package scan + conscrypt reload) without rebooting
on:
  workflow_dispatch:

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_AVD_HOME: /opt/avd
  APK_URL: ${{ vars.APK_URL || 'https://github.com/digivasserver-ai/ci-repro/releases/download/apks-latest/microg-services.apk' }}

jobs:
  install-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install SDK + emulator + system image
        run: |
          set -euxo pipefail
          sudo mkdir -p "$ANDROID_HOME" && sudo chown -R "$USER": "$ANDROID_HOME"
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "emulator" \
            "platforms;android-30" \
            "system-images;android-30;aosp_atd;x86_64" > /dev/null

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n test -k "system-images;android-30;aosp_atd;x86_64" --force

      - name: Boot emulator (KVM)
        run: |
          set -euo pipefail
          sudo chmod 0666 /dev/kvm || true
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd test \
            -no-window -no-audio -no-boot-anim \
            -accel auto -gpu swiftshader_indirect \
            -no-snapshot -no-metrics -writable-system \
            -memory 2048 -cores 2 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          START=$SECONDS
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then echo "EMULATOR DIED"; tail -40 /tmp/emulator.log; exit 1; fi
            set +o pipefail
            BOOT=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            set -o pipefail
            if [ "$BOOT" = "1" ]; then echo "boot_seconds=$((SECONDS - START))"; break; fi
            sleep 3
          done
          [ "$BOOT" = "1" ] || { echo "BOOT TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }

      - name: arm overlayfs (remount) + relaunch emulator for writable /system
        run: |
          set -euxo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" root
          sleep 3
          timeout 60 "$ADB" wait-for-device || true
          "$ADB" shell id
          # arms overlayfs; applied at next kernel boot (steps below)
          timeout 60 "$ADB" remount || echo "remount reported failure (ok if kept read-only for now)"
          # graceful emulator exit (flushes AVD qcow2), then fresh kernel boot
          timeout 60 "$ADB" emu kill || true
          sleep 5
          pkill -f 'emulator.*-avd test' || true
          sleep 5
          # relaunch: overlayfs is now armed and applies on this boot
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd test \
            -no-window -no-audio -no-boot-anim \
            -accel auto -gpu swiftshader_indirect \
            -no-snapshot -no-metrics -writable-system \
            -memory 2048 -cores 2 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          START=$SECONDS
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then echo "EMULATOR DIED (relaunch)"; tail -40 /tmp/emulator.log; exit 1; fi
            set +o pipefail
            BOOT=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            set -o pipefail
            if [ "$BOOT" = "1" ]; then echo "relaunch_boot_seconds=$((SECONDS - START))"; break; fi
            sleep 3
          done
          [ "$BOOT" = "1" ] || { echo "RELAUNCH BOOT TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }
          "$ADB" root
          sleep 3
          timeout 60 "$ADB" wait-for-device || true
          "$ADB" shell "id"
          "$ADB" shell "touch /system/remount-test" && echo "SYSTEM WRITABLE" || { echo "STILL READ-ONLY"; "$ADB" shell "mount | grep -E 'overlay| /system '" || true; exit 1; }

      - name: Install GmsCore as privileged app + CA cert, restart framework
        run: |
          set -euxo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          curl -sSL "$APK_URL" -o /tmp/gms.apk || { echo "APK download failed ($APK_URL)"; exit 1; }
          ls -la /tmp/gms.apk
          # demo CA so the emulator trusts our TLS droidguard server
          CERT=$(ls demo-certs/ca-*.0 2>/dev/null | head -1)
          if [ -n "$CERT" ]; then
            "$ADB" push "$CERT" /system/etc/security/cacerts/
            "$ADB" shell "chmod 644 /system/etc/security/cacerts/$(basename "$CERT")"
            echo "CA pushed: $(basename "$CERT")"
          else
            echo "no demo CA in repo; skipping (phase 2b adds it)"
          fi
          "$ADB" shell "mkdir -p /system/priv-app/MicroGGmsCore"
          "$ADB" push /tmp/gms.apk /system/priv-app/MicroGGmsCore/gms.apk
          "$ADB" shell "chmod 644 /system/priv-app/MicroGGmsCore/gms.apk"
          "$ADB" shell "ls -la /system/priv-app/MicroGGmsCore/"
          # framework restart = package scan + conscrypt reload, no reboot
          timeout 60 "$ADB" shell "stop && start" || true
          for i in $(seq 1 120); do
            set +o pipefail
            B=$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            set -o pipefail
            if [ "$B" = "1" ]; then echo "framework restarted"; break; fi
            sleep 3
          done
          "$ADB" root
          sleep 3
          timeout 60 "$ADB" wait-for-device || true

      - name: Verify install (pm list / appops)
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell "pm list packages | grep -i gms" || true
          "$ADB" shell "pm path com.google.android.gms" || true
          "$ADB" shell "dumpsys package com.google.android.gms | grep -E 'userId=|versionName|enabled=' | head -5" || true

      - name: Install patched droidguard server (python) on runner
        run: |
          echo "placeholder: droidguard_multistep_server.py will be dropped here in phase 2b"

      - name: Upload artifacts (logs/screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test
          path: |
            /tmp/emulator.log
            *.txt