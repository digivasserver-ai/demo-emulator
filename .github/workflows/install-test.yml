name: "Demo: microG install-test"

# Phase 2a: install the patched GmsCore (built by ci-repro) as a privileged
# app on the ATD emulator, configure DroidGuard remote mode, and verify the
# multi-step reference server responds. No video yet — prove the wiring first.
on:
  workflow_dispatch:

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_AVD_HOME: /opt/avd
  APK_URL: ${{ vars.APK_URL || 'https://github.com/digivasserver-ai/ci-repro/releases/download/apks-latest/microg-services.apk' }}

jobs:
  install-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install SDK + emulator + system image
        run: |
          set -euxo pipefail
          sudo mkdir -p "$ANDROID_HOME" && sudo chown -R "$USER": "$ANDROID_HOME"
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "emulator" \
            "platforms;android-30" \
            "system-images;android-30;aosp_atd;x86_64" > /dev/null

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n test -k "system-images;android-30;aosp_atd;x86_64" --force

      - name: Boot emulator (KVM)
        run: |
          set -euo pipefail
          sudo chmod 0666 /dev/kvm || true
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd test \
            -no-window -no-audio -no-boot-anim \
            -accel auto -gpu swiftshader_indirect \
            -no-snapshot -no-metrics \
            -memory 2048 -cores 2 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          START=$SECONDS
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then echo "EMULATOR DIED"; tail -40 /tmp/emulator.log; exit 1; fi
            set +o pipefail
            BOOT=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            set -o pipefail
            if [ "$BOOT" = "1" ]; then echo "boot_seconds=$((SECONDS - START))"; break; fi
            sleep 3
          done
          [ "$BOOT" = "1" ] || { echo "BOOT TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }

      - name: Get root shell
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" root
          sleep 3
          "$ADB" wait-for-device
          "$ADB" shell id
          "$ADB" remount || true
          "$ADB" shell "mount -o rw,remount /system" || true
          "$ADB" shell "ls /system/priv-app/ | head"

      - name: Install GmsCore as privileged app
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          curl -sSL "$APK_URL" -o /tmp/gms.apk || { echo "APK download failed ($APK_URL)"; exit 1; }
          ls -la /tmp/gms.apk
          "$ADB" shell "mkdir -p /system/priv-app/MicroGGmsCore"
          "$ADB" push /tmp/gms.apk /system/priv-app/MicroGGmsCore/gms.apk
          "$ADB" shell "chmod 644 /system/priv-app/MicroGGmsCore/gms.apk"
          "$ADB" shell "ls -la /system/priv-app/MicroGGmsCore/"

      - name: Verify install (pm list / appops)
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell "pm list packages | grep -i gms" || true
          "$ADB" shell "pm path com.google.android.gms" || true

      - name: Install patched droidguard server (python) on runner
        run: |
          echo "placeholder: droidguard_multistep_server.py will be dropped here in phase 2b"

      - name: Upload artifacts (logs/screenshot)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test
          path: |
            /tmp/emulator.log
            *.txt