name: Demo-Install
on: workflow_dispatch

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_AVD_HOME: /opt/avd

jobs:
  install-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK + emulator + system image + build-tools
        run: |
          set -euxo pipefail
          sudo mkdir -p "$ANDROID_HOME" && sudo chown -R "$USER": "$ANDROID_HOME"
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            platform-tools emulator \
            "platforms;android-30" "build-tools;34.0.0" \
            "system-images;android-30;aosp_atd;x86_64" > /dev/null

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n test -k "system-images;android-30;aosp_atd;x86_64" --force

      - name: Boot emulator (KVM)
        run: |
          set -euo pipefail
          sudo chmod 0666 /dev/kvm || true
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd test \
            -no-window -no-audio -no-boot-anim \
            -accel auto -gpu swiftshader_indirect \
            -no-snapshot -no-metrics \
            -memory 2048 -cores 2 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          START=$SECONDS
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then echo "EMULATOR DIED"; tail -40 /tmp/emulator.log; exit 1; fi
            set +o pipefail
            BOOT=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            set -o pipefail
            if [ "$BOOT" = "1" ]; then echo "boot_seconds=$((SECONDS - START))"; break; fi
            sleep 3
          done
          [ "$BOOT" = "1" ] || { echo "BOOT TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }

      - name: Build probe APK (runner)
        run: bash probe/build_apk.sh

      - name: Install apps + write DroidGuard prefs
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/opt/android-sdk}"
          ADB="$ANDROID_HOME/platform-tools/adb"
          curl -sSL "https://github.com/digivasserver-ai/ci-repro/releases/download/apks-97b0877/com.google.android.gms-252432000.apk" -o /tmp/gms.apk || { echo "APK download failed"; exit 1; }
          ls -la /tmp/gms.apk
          echo "===== dexdump IGmsServiceBroker stub ====="
          cd /tmp && rm -rf dex-x && mkdir dex-x && cd dex-x
          unzip -o -q /tmp/gms.apk "classes*.dex"
          for d in classes*.dex; do
            "$ANDROID_HOME/build-tools/34.0.0/dexdump" -d "$d" > dd.txt 2>/dev/null || true
            if grep -q "IGmsServiceBroker" dd.txt; then
              echo "=== $d ==="
              grep -E "Class descriptor|name\s+: '(getService|onTransact|validateAccount|getWalletServiceWithPackageName)'|static fields|TRANSACTION" dd.txt | head -40
            fi
          done
          rm -rf /tmp/dex-x
          echo "===== end dexdump ====="
          # microG's assembleRelease output is unsigned; sign for install
          keytool -genkeypair -keystore /tmp/demo.keystore -alias demo \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Demo,O=Demo,C=US" > /dev/null 2>&1
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks /tmp/demo.keystore --ks-pass pass:android \
            --out /tmp/gms-signed.apk /tmp/gms.apk
          "$ADB" install -r /tmp/gms-signed.apk
          "$ADB" install -r probe/build/demo.apk
          "$ADB" root
          sleep 3
          timeout 60 "$ADB" wait-for-device || true
          GMS_UID=$("$ADB" shell "cmd package list packages -U" | awk -F: '/com.google.android.gms/{print $NF; exit}' | tr -d '\r')
          echo "GMS_UID=$GMS_UID"
          [ -n "$GMS_UID" ] || { echo "could not resolve gms uid"; exit 1; }
          "$ADB" shell "rm -rf /data/data/com.google.android.gms/shared_prefs"
          "$ADB" shell "mkdir -p /data/data/com.google.android.gms/shared_prefs"
          "$ADB" shell "cat > /data/data/com.google.android.gms/shared_prefs/com.google.android.gms_preferences.xml" < prefs/com.google.android.gms_preferences.xml
          "$ADB" shell "chown -R $GMS_UID:$GMS_UID /data/data/com.google.android.gms/shared_prefs"
          "$ADB" shell "chmod 660 /data/data/com.google.android.gms/shared_prefs/com.google.android.gms_preferences.xml"
          "$ADB" shell "cat /data/data/com.google.android.gms/shared_prefs/com.google.android.gms_preferences.xml"

      - name: Start reference droidguard server (runner)
        run: |
          set -euxo pipefail
          nohup python3 droidguard-server/droidguard_multistep_server.py --host 0.0.0.0 --port 8080 > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 3
          cat /tmp/server.log
          curl -s "http://127.0.0.1:8080/?action=begin&flow=test&source=test" -o /tmp/begin.json -w "HTTP %{http_code}\n" || true
          head -c 300 /tmp/begin.json 2>/dev/null || true

      - name: Run probe + verify marker
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" shell "rm -f /data/data/com.digivasserver.demo/demo_result.txt" || true
          "$ADB" shell "am start -n com.digivasserver.demo/.MainActivity"
          OK=""
          for i in $(seq 1 60); do
            R=$("$ADB" shell "cat /data/data/com.digivasserver.demo/demo_result.txt 2>/dev/null | tr -d '\r'" || echo "")
            if [ -n "$R" ]; then echo "demo marker: $R"; OK=1; break; fi
            sleep 2
          done
          echo "---- probe logcat ----"
          "$ADB" logcat -d -s DGProbe:* AndroidRuntime:E | tail -120 || true
          echo "---- gms/droidguard/binder logcat ----"
          "$ADB" logcat -d | grep -iE "GmsGuard|GmsServiceBroker|droidguard|RemoteException|SecurityException|Parcel|binder|ANR|Transaction|DGProbe|ActivityManager|System.err" | tail -400 || true
          echo "---- FULL logcat saved ----"
          "$ADB" logcat -d > /tmp/logcat.txt || true
          wc -l /tmp/logcat.txt || true
          echo "---- dumpsys gms ----"
          "$ADB" shell "dumpsys activity processes | grep -B2 -A8 -i gms" | head -60 || true
          echo "---- server log ----"
          tail -60 /tmp/server.log || true
          [ -n "$OK" ] || { echo "NO MARKER"; exit 1; }

      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test
          path: |
            /tmp/emulator.log
            /tmp/server.log
            /tmp/begin.json
            /tmp/logcat.txt
            /tmp/nsc.xml