name: "Demo: multistep DroidGuard video"

# Phase 2b: end-to-end wire-protocol demo ON a virtual device.
#   - patched microG (built by ci-repro, incl. PR microg/GmsCore#3750) runs on
#     the ATD emulator (identical setup to the ci runner)
#   - DroidGuard is switched to Network mode -> multistep server (mock backend)
#   - a minimal probe drives guardWithRequest-like flow via the real AIDL
#   - the emulator screen is recorded to a video artifact
on:
  workflow_dispatch:

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_AVD_HOME: /opt/avd
  # Hardcoded (NOT vars.*) so a repo var can't silently swap in a non-PR-#3750 APK.
  # This is the ci-repro build incl. PR microg/GmsCore#3750 (the -hw patched GmsCore).
  APK_URL: https://github.com/digivasserver-ai/ci-repro/releases/download/apks-97b0877/com.google.android.gms-252432000-hw.apk

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install SDK + emulator + system image + build-tools
        run: |
          set -euxo pipefail
          sudo mkdir -p "$ANDROID_HOME" && sudo chown -R "$USER":"$USER" "$ANDROID_HOME"
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "emulator" \
            "platforms;android-30" \
            "build-tools;34.0.0" \
            "system-images;android-30;aosp_atd;x86_64" > /dev/null

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n test -k "system-images;android-30;aosp_atd;x86_64" --force
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd | head -8

      - name: Boot emulator (KVM)
        run: |
          set -euo pipefail
          sudo chmod 0666 /dev/kvm || true
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd test \
            -no-window -no-audio -no-boot-anim \
            -accel auto -gpu swiftshader_indirect \
            -no-snapshot -no-metrics \
            -memory 2048 -cores 2 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          START=$SECONDS
          BOOT=""
          for i in $(seq 1 150); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then echo "EMULATOR DIED"; tail -40 /tmp/emulator.log; exit 1; fi
            set +o pipefail
            BOOT=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            set -o pipefail
            if [ "$BOOT" = "1" ]; then echo "boot_seconds=$((SECONDS - START))"; break; fi
            sleep 3
          done
          [ "$BOOT" = "1" ] || { echo "BOOT TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }

      - name: Install patched GmsCore (re-signed) + probe
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          curl -sSL "$APK_URL" -o /tmp/gms.apk
          echo "APK: $(stat -c %s /tmp/gms.apk) bytes"
          # ci-repro publishes the patched GmsCore unsigned -> re-sign so it is installable.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          "$APKSIGNER" sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out /tmp/gms-signed.apk /tmp/gms.apk
          "$APKSIGNER" verify --print-certs /tmp/gms-signed.apk || true
          "$ADB" install -r /tmp/gms-signed.apk
          echo "--- build + install probe ---"
          chmod +x probe/build_apk.sh
          probe/build_apk.sh
          "$ADB" install -r probe/build/demo.apk
          "$ADB" shell "pm path com.google.android.gms" || true

      - name: Configure emulator (DroidGuard Network prefs)
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          # root is required to write /data/data/.../shared_prefs for another app.
          # (probe-install3 pattern: install first, then adb root before touching prefs.)
          "$ADB" root
          sleep 3
          timeout 60 "$ADB" wait-for-device || true
          "$ADB" shell "am force-stop com.google.android.gms" || true
          "$ADB" shell "mkdir -p /data/data/com.google.android.gms/shared_prefs" || true
          GMS_UID=$("$ADB" shell "cmd package list packages -U" | awk '/package:com.google.android.gms/{v=$NF; sub(/^uid:/,"",v); print v; exit}' | tr -d '\r')
          echo "GmsCore uid=$GMS_UID"
          [ -n "$GMS_UID" ] || { echo "could not resolve gms uid"; exit 1; }
          # prefs via base64 (avoids column-0 heredoc truncating the YAML block scalar).
          # HTTP :8080 (no TLS/CA needed) - server runs on the runner, reachable via 10.0.2.2.
          printf '%s' '' | base64 -d > /tmp/prefs.xml
          "$ADB" shell "cat > /data/data/com.google.android.gms/shared_prefs/com.google.android.gms_preferences.xml" < /tmp/prefs.xml
          "$ADB" shell "chown -R $GMS_UID:$GMS_UID /data/data/com.google.android.gms/shared_prefs; chmod 660 /data/data/com.google.android.gms/shared_prefs/com.google.android.gms_preferences.xml"
          "$ADB" shell "cat /data/data/com.google.android.gms/shared_prefs/com.google.android.gms_preferences.xml"

      - name: Start multistep DroidGuard server (mock backend)
        run: |
          python3 --version
          (cd droidguard-server && python3 -m pip install --quiet pytest 2>/dev/null || true)
          nohup python3 droidguard-server/droidguard_multistep_server.py --host 0.0.0.0 --port 8080 > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          sleep 3
          cat /tmp/server.log || true
          echo "server.pid: $(cat /tmp/server.pid)"

      - name: Run demo under screenrecord (video)
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          # warm GmsCore once so the demo isn't first-run cold
          "$ADB" shell "am force-stop com.google.android.gms" || true
          "$ADB" shell "rm -f /sdcard/demo_result.txt"
          "$ADB" logcat -c || true
          # start recording (up to 6 minutes to span the whole sweep sequence)
          "$ADB" shell "screenrecord --time-limit 180 --bit-rate 4000000 /sdcard/demo.mp4" &
          REC_PID=$!
          sleep 3
          "$ADB" shell "am start -n com.digivasserver.demo/.MainActivity"
          # wait for the demo result (sweep can take ~60s)
          OK=""
          for i in $(seq 1 70); do
            sleep 3
            R=$("$ADB" shell "cat /sdcard/demo_result.txt 2>/dev/null | tr -d '\r'" || echo "")
            if [ -n "$R" ]; then OK=$R; break; fi
          done
          echo "demo_result=$OK"
          # show probe logcat
          "$ADB" logcat -d -s DGProbe 2>/dev/null | tail -60 || true
          echo "---- server log ----"
          tail -60 /tmp/server.log || true
          # stop recording and pull the video
          "$ADB" shell "pkill -INT -f screenrecord" || true
          wait $REC_PID 2>/dev/null || true
          sleep 2
          "$ADB" shell "ls -la /sdcard/demo.mp4" || true
          "$ADB" pull /sdcard/demo.mp4 /tmp/demo.mp4 || true
          "$ADB" shell "screencap -p /sdcard/final.png"; "$ADB" pull /sdcard/final.png /tmp/final.png || true
          # write the result marker so the run outcome is explicit
          echo "$OK" > /tmp/demo_result.txt

      - name: Upload artifacts (video + server log + screen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidguard-demo
          path: |
            /tmp/demo.mp4
            /tmp/final.png
            /tmp/demo_result.txt
            /tmp/server.log
            /tmp/emulator.log
            *.txt
