name: "Emulator boot dry-run"

on:
  workflow_dispatch:

jobs:
  boot:
    name: boot aosp_atd api30
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Check KVM availability
        run: |
          if [ -e /dev/kvm ]; then echo "kvm: yes"; else echo "kvm: no"; fi

      - name: Install SDK + emulator + system image
        run: |
          set -euxo pipefail
          sudo mkdir -p "$ANDROID_HOME" && sudo chown -R "$USER": "$ANDROID_HOME"
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "emulator" \
            "platforms;android-30" \
            "system-images;android-30;aosp_atd;x86_64" > /dev/null

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n test -k "system-images;android-30;aosp_atd;x86_64" --force
          echo "--- avd dir ---"
          ls -la "$ANDROID_AVD_HOME"/ 2>&1 || true
          echo "--- avds seen by emulator ---"
          "$ANDROID_HOME/emulator/emulator" -list-avds 2>&1 || true

      - name: Boot emulator (software accel, headless)
        run: |
          set -euo pipefail  # NO pipefail
          # KVM device exists but runner user lacks group perms; open it.
          sudo chmod 0666 /dev/kvm || true
          ls -l /dev/kvm
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd test \
            -no-window -no-audio -no-boot-anim \
            -accel auto -gpu swiftshader_indirect \
            -no-snapshot -no-metrics \
            -memory 2048 -cores 2 \
            > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          START=$SECONDS
          echo "emulator pid=$EMU_PID" > /tmp/emu.pid
          # fast-fail if the emulator process died
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "EMULATOR PROCESS DIED"
              tail -40 /tmp/emulator.log
              exit 1
            fi
            # Disable pipefail just for this adb call
            set +o pipefail
            BOOT=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || echo "")
            set -o pipefail
            if [ "$BOOT" = "1" ]; then
              echo "boot_seconds=$((SECONDS - START))" | tee boot-time.txt
              break
            fi
            sleep 5
          done
          if [ "$BOOT" != "1" ]; then
            echo "BOOT TIMEOUT after $((SECONDS - START))s"
            tail -50 /tmp/emulator.log
            exit 1
          fi

      - name: Post-boot diagnostics
        run: |
          set -euo pipefail
          ADB="$ANDROID_HOME/platform-tools/adb"
          {
            echo "boot_completed=$($ADB shell getprop sys.boot_completed | tr -d '\r')"
            echo "ro.debuggable=$($ADB shell getprop ro.debuggable | tr -d '\r')"
            echo "ro.build.version.sdk=$($ADB shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "ro.product.model=$($ADB shell getprop ro.product.model | tr -d '\r')"
            $ADB root > /dev/null 2>&1 || true
            sleep 2
            echo "id_after=$($ADB shell id 2>/dev/null | tr -d '\r')"
          } | tee sysinfo.txt
          "$ADB" exec-out screencap -p > screenshot.png

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-dryrun
          path: |
            boot-time.txt
            sysinfo.txt
            screenshot.png
            /tmp/emulator.log
