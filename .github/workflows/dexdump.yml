name: Dexdump Stub
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download GMS APK
        run: |
          curl -sSL "https://github.com/digivasserver-ai/ci-repro/releases/download/apks-97b0877/com.google.android.gms-252432000.apk" -o /tmp/gms.apk
          ls -la /tmp/gms.apk
          sha256sum /tmp/gms.apk
      - name: Install SDK build-tools
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" >/dev/null 2>&1 || { echo SDKMAN_FAIL; ls "$ANDROID_HOME/cmdline-tools/latest/bin"; exit 1; }
      - name: Dexdump IGmsServiceBroker\$Stub
        run: |
          cd /tmp && mkdir -p x && cd x
          unzip -o -q /tmp/gms.apk "classes*.dex"
          ls -la classes*.dex
          DEXDUMP="$HOME/android-sdk/build-tools/35.0.0/dexdump"
          for d in classes*.dex; do
            echo "===== $d ====="
            "$DEXDUMP" -d "$d" 2>/dev/null | awk '/Class descriptor/{if ($0 ~ /IGmsServiceBroker\$Stub/) f=1; else if (f) exit} f' | grep -E "TRANSACTION|name|const|#\(in|type" | head -80
          done